on:
  push:
    branches:
      - main

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: dispatch documentation deployment
        if: github.repository == 'nf-neuro/website'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DOCUMENTATION_PUBLISHING }}
          repository: nf-neuro/nf-neuro.github.io
          event-type: publish-documentation
