name: Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      dry-run:
        description: "Whether to do a dry run (test the deployment without actually publishing)"
        required: false
        default: false
        type: boolean

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  markdown-components:
    name: markdown-modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nf-neuro/modules
          ref: main
          path: nf-neuro
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: "1.8.5"
          virtualenvs-create: true
          virtualenvs-in-project: true
          virtualenvs-path: .venv
          installer-parallel: true
      - name: Install project docs extra with poetry
        working-directory: nf-neuro
        run: |
          poetry install --extras docs
      - name: Generate markdown
        id: generate-module
        run: |
          shopt -s globstar
          function convert_module () {
            local file="$1"
            local module_name=$(basename "$(dirname "$file")")
            local category=$(basename "$(dirname "$(dirname "$file")")")
            mkdir -p modules/$category
            poetry -C nf-neuro run nf-neuro-convert-module \
              $(dirname "$file") ${{ github.sha }} \
              modules/${category}/${module_name}.mdx
          }
          function convert_subworkflow () {
            local file="$1"
            local sbwf_name=$(basename "$(dirname "$file")")
            poetry -C nf-neuro run nf-neuro-convert-subworkflow \
              $(dirname "$file") ${{ github.sha }} \
              subworkflows/${sbwf_name}.mdx
          }
          export -f convert_module
          export -f convert_subworkflow

          mkdir -p modules/ subworkflows/
          printf '%s\n' nf-neuro/modules/nf-neuro/**/meta.yml | xargs -P $(nproc) -I {} bash -c 'convert_module "$@"' _ {}
          printf '%s\n' nf-neuro/subworkflows/nf-neuro/**/meta.yml | xargs -P $(nproc) -I {} bash -c 'convert_subworkflow "$@"' _ {}
      - name: Pack into artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markdown
          path: |
            modules/
            subworkflows/

  build:
    needs: markdown-components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nf-neuro/website

      - name: Download components markdown
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: markdown
          path: src/content/docs/api/

      - name: Install, build, and upload your site
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        with:
          node-version: 24
          package-manager: pnpm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry-run }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
